<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfa;
        --side: #f1f0ed;
        --surface: #ffffff;
        --text: #1f2328;
        --muted: #59636e;
        --border: #dcdad5;
        --accent: #2f6f5e;
        --accent-bg: #e3f0eb;
        --open: #a15c07;
        --open-bg: #fdf3e3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17191c;
          --side: #1e2125;
          --surface: #22262b;
          --text: #e6e6e3;
          --muted: #9aa1a9;
          --border: #353a40;
          --accent: #6cc3a8;
          --accent-bg: #1b2f29;
          --open: #f0b25a;
          --open-bg: #33270f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      aside {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        padding: 1.5rem 0.75rem;
        background: var(--side);
        border-right: 1px solid var(--border);
      }
      .spec-title {
        margin: 0 0 0.4rem;
        padding: 0 0.6rem;
        font-size: 1.15rem;
        font-weight: 650;
        line-height: 1.3;
      }
      .chip {
        display: inline-block;
        margin-left: 0.6rem;
        padding: 0.1rem 0.5rem;
        border-radius: 99px;
        background: var(--accent-bg);
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 600;
      }
      .chip.open {
        background: var(--open-bg);
        color: var(--open);
      }
      .group {
        margin: 1.1rem 0.6rem 0.3rem;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      nav a {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.6rem;
        border-radius: 6px;
        color: var(--text);
        font-size: 0.92rem;
        text-decoration: none;
      }
      nav a:hover {
        background: var(--border);
      }
      nav a.active {
        background: var(--accent-bg);
        color: var(--accent);
        font-weight: 600;
      }
      nav .meta {
        margin-left: auto;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
      .dot.open {
        background: var(--open);
      }
      main {
        max-width: 56rem;
        padding: 2.5rem 3rem;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }
      h1 {
        margin: 0 0 0.3rem;
        font-size: 1.5rem;
        line-height: 1.3;
      }
      h2 {
        margin: 1.75rem 0 0.5rem;
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .lead,
      .muted {
        color: var(--muted);
      }
      .status {
        display: inline-block;
        margin: 0.2rem 0 1rem;
        padding: 0.15rem 0.6rem;
        border-radius: 6px;
        background: var(--accent-bg);
        color: var(--accent);
        font-size: 0.85rem;
      }
      .status.open {
        background: var(--open-bg);
        color: var(--open);
        font-weight: 600;
      }
      .options {
        display: grid;
        gap: 0.6rem;
        margin: 1rem 0;
      }
      .option {
        display: grid;
        grid-template-columns: 1.6rem 1fr 1fr 1fr;
        gap: 0.75rem;
        align-items: start;
        padding: 0.75rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      .option.recommended {
        border-color: var(--accent);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .option.chosen {
        border-color: var(--accent);
        background: var(--accent-bg);
      }
      .option b {
        display: block;
      }
      .letter {
        color: var(--muted);
        font-weight: 700;
      }
      .tag {
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 600;
      }
      .pro::before {
        content: '+ ';
        color: var(--accent);
        font-weight: 700;
      }
      .con::before {
        content: '− ';
        color: var(--open);
        font-weight: 700;
      }
      .callout {
        margin: 1rem 0;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        background: var(--accent-bg);
      }
      .callout.open {
        background: var(--open-bg);
      }
      ul,
      ol {
        margin: 0.3rem 0;
        padding-left: 1.2rem;
      }
      li {
        margin: 0.25rem 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }
      th,
      td {
        padding: 0.5rem 0.6rem;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
      }
      code {
        padding: 0.1em 0.3em;
        border-radius: 4px;
        background: var(--side);
        font:
          0.86em ui-monospace,
          'Cascadia Code',
          Consolas,
          monospace;
      }
      pre {
        overflow-x: auto;
        padding: 0.8rem 1rem;
        border-radius: 6px;
        background: var(--side);
      }
      pre code {
        padding: 0;
      }
      a {
        color: var(--accent);
      }
      a.ref {
        font-size: 0.8em;
        text-decoration: none;
        vertical-align: super;
      }
      .pager {
        display: flex;
        justify-content: space-between;
        margin-top: 2.5rem;
        font-size: 0.9rem;
      }
      .pager a {
        text-decoration: none;
      }
      @media (max-width: 800px) {
        body {
          grid-template-columns: 1fr;
        }
        aside {
          position: static;
          height: auto;
        }
        main {
          padding: 1.5rem 1rem;
        }
        .option {
          grid-template-columns: 1.6rem 1fr;
        }
      }
    </style>
  </head>
  <body>
    <aside>{{sidebar}}</aside>
    <main>{{panels}}</main>
    <script>
      // one panel at a time, chosen by the URL hash, so spec.html#d-2 opens decision 2
      const show = () => {
        const requested = location.hash.slice(1)
        const id = document.getElementById(`p-${requested}`) ? requested : 'overview'
        document.querySelectorAll('.panel').forEach((el) => {
          el.classList.toggle('active', el.id === `p-${id}`)
        })
        document.querySelectorAll('nav a').forEach((el) => {
          el.classList.toggle('active', el.dataset.id === id)
        })
        window.scrollTo(0, 0)
      }
      window.addEventListener('hashchange', show)
      show()
    </script>
  </body>
</html>
