<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfa;
        --surface: #f1f0ed;
        --text: #1f2328;
        --muted: #59636e;
        --border: #d8d6d1;
        --accent: #2f6f5e;
        --open: #a15c07;
        --open-bg: #fdf3e3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17191c;
          --surface: #212428;
          --text: #e6e6e3;
          --muted: #9aa1a9;
          --border: #353a40;
          --accent: #6cc3a8;
          --open: #f0b25a;
          --open-bg: #33270f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 52rem;
        margin: 0 auto;
        padding: 2.5rem 1rem 4rem;
      }
      h1 {
        font-size: 1.9rem;
        line-height: 1.25;
        margin: 0 0 0.25rem;
      }
      h1 + p {
        color: var(--muted);
        margin-top: 0;
      }
      h2 {
        font-size: 1.3rem;
        margin: 2.5rem 0 0.75rem;
        padding-bottom: 0.3rem;
        border-bottom: 1px solid var(--border);
      }
      h3 {
        font-size: 1.05rem;
        margin: 2rem 0 0.5rem;
      }
      h3.decision {
        padding: 0.4rem 0.75rem;
        border-left: 3px solid var(--accent);
        background: var(--surface);
        border-radius: 0 6px 6px 0;
      }
      h3.decision.open {
        border-left-color: var(--open);
        background: var(--open-bg);
      }
      .banner {
        padding: 0.6rem 0.9rem;
        border-radius: 6px;
        background: var(--open-bg);
        color: var(--open);
        font-weight: 600;
      }
      a {
        color: var(--accent);
      }
      .banner a {
        color: inherit;
      }
      table {
        display: block;
        overflow-x: auto;
        border-collapse: collapse;
        margin: 0.75rem 0;
        font-size: 0.93rem;
      }
      th,
      td {
        padding: 0.4rem 0.7rem;
        border: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }
      th {
        background: var(--surface);
      }
      code {
        font:
          0.88em ui-monospace,
          'Cascadia Code',
          Consolas,
          monospace;
        padding: 0.1em 0.3em;
        border-radius: 4px;
        background: var(--surface);
      }
      pre {
        overflow-x: auto;
        padding: 0.8rem 1rem;
        border-radius: 6px;
        background: var(--surface);
      }
      pre code {
        padding: 0;
      }
    </style>
  </head>
  <body>
    <main>{{banner}} {{body}}</main>
  </body>
</html>
