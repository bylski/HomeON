[platformio]
src_dir = devices

; shared config of every ESP8266 device (pulled in with `extends`)
[esp8266]
platform = espressif8266
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson @ ^7.0.0
extra_scripts =
    pre:scripts/get_env.py

[env:test_sensors]
extends = esp8266
board = nodemcuv2
build_src_filter = +<test_sensors/>

; plain C++ tests built and run on the PC (`pnpm test:firmware`), see docs/conventions/testing.md
; only Arduino-free libraries are compiled, so Arduino glue code is ignored
[env:native]
platform = native
test_framework = googletest
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
lib_ignore =
    Mqtt
    WifiService
build_flags = -std=gnu++17
